<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Virtual desktops with a note">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e93dc"/>
      <stop offset=".54" stop-color="#1755bc"/>
      <stop offset="1" stop-color="#152b77"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#fffbe1"/>
      <stop offset="1" stop-color="#ffdc77"/>
    </linearGradient>
    <linearGradient id="pencil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#69e8fc"/>
      <stop offset="1" stop-color="#20a2ee"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="49" fill="url(#background)"/>
  <rect x="9" y="9" width="238" height="238" rx="48" fill="none" stroke="#b2e9ff" stroke-opacity=".65" stroke-width="2"/>
  <!-- Four virtual desktops in a two-by-two overview. -->
  <g fill="#b4e8ff" fill-opacity=".23" stroke="#bcefff" stroke-opacity=".82" stroke-width="5">
    <rect x="34" y="38" width="83" height="78" rx="12"/>
    <rect x="131" y="38" width="83" height="78" rx="12"/>
    <rect x="34" y="130" width="83" height="78" rx="12"/>
    <rect x="131" y="130" width="83" height="78" rx="12"/>
  </g>
  <path d="M48 53h52M48 65h35M145 53h52M145 65h35M48 145h52M48 157h35" fill="none" stroke="#c6f0ff" stroke-width="4" stroke-linecap="round" stroke-opacity=".57"/>
  <!-- A sticky note clearly overlaps the desktop overview. -->
  <rect x="90" y="93" width="135" height="131" rx="17" fill="#091d57" opacity=".3"/>
  <rect x="85" y="87" width="134" height="132" rx="17" fill="url(#paper)" stroke="#fff3af" stroke-width="3"/>
  <path d="M85 104q0-17 17-17h100q17 0 17 17v17H85Z" fill="#ffbd44"/>
  <circle cx="111" cy="104" r="6" fill="#ffffff" opacity=".8"/>
  <circle cx="131" cy="104" r="6" fill="#ffffff" opacity=".8"/>
  <path d="M108 147h83M108 170h64M108 192h37" stroke="#826a72" stroke-opacity=".75" stroke-width="9" stroke-linecap="round"/>
  <!-- Pen signals the notes can be edited. -->
  <g transform="rotate(36 202 198)">
    <rect x="192" y="164" width="19" height="57" rx="7" fill="url(#pencil)" stroke="#0662a2" stroke-width="2"/>
    <rect x="192" y="164" width="19" height="10" rx="4" fill="#e0fbff"/>
    <path d="M192 214h19l-9.5 21Z" fill="#fff0d0" stroke="#13557d" stroke-width="2"/>
    <path d="M198 228h7l-3.5 7Z" fill="#15456f"/>
  </g>
</svg>