<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192" role="img" aria-labelledby="title desc">
  <title id="title">Virtual Desktop Notes</title>
  <desc id="desc">Four glass-blue virtual desktops behind a golden note and a blue pencil on a rounded blue tile.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2=".85" y2="1">
      <stop stop-color="#09c9f4"/><stop offset=".42" stop-color="#0088e7"/><stop offset="1" stop-color="#00319e"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2=".8" y2="1">
      <stop stop-color="#a6ffff"/><stop offset=".4" stop-color="#28c9ff"/><stop offset="1" stop-color="#0065d5"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38c9fc"/><stop offset="1" stop-color="#0866cb"/>
    </linearGradient>
    <linearGradient id="glassEdge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ddffff"/><stop offset=".48" stop-color="#79e3ff"/><stop offset="1" stop-color="#25aaf4"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2=".9">
      <stop stop-color="#fffbd7"/><stop offset=".6" stop-color="#fff0a3"/><stop offset="1" stop-color="#ffdb59"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffe126"/><stop offset=".5" stop-color="#ffbd00"/><stop offset="1" stop-color="#ffac00"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#a79e7c"/><stop offset="1" stop-color="#80775b"/>
    </linearGradient>
    <linearGradient id="barrel" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#0878dd"/><stop offset=".3" stop-color="#28caff"/><stop offset=".6" stop-color="#0da5ef"/><stop offset="1" stop-color="#0669ca"/>
    </linearGradient>
    <linearGradient id="eraser" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b0edff"/><stop offset="1" stop-color="#659fdc"/>
    </linearGradient>
    <clipPath id="tileClip"><rect x="2" y="2" width="188" height="188" rx="45"/></clipPath>
    <clipPath id="noteClip"><rect x="62" y="69" width="106" height="100" rx="15"/></clipPath>
  </defs>
  <!-- SVG shapes and gradients only; no raster embedding, fonts or filters. -->
  <rect x="2" y="2" width="188" height="188" rx="45" fill="url(#tile)" stroke="url(#rim)" stroke-width="3"/>
  <g clip-path="url(#tileClip)">
    <path d="M3 111 125 2h42L3 157Z" fill="#65e9ff" opacity=".08"/>
    <path d="M8 159c34 17 106 26 175-1v34H8Z" fill="#001762" opacity=".13"/>
  </g>
  <rect x="5" y="5" width="182" height="182" rx="42" fill="none" stroke="#b7f7ff" stroke-opacity=".13"/>
  <!-- Four desktops: the lower right card is covered by the note. -->
  <g fill="#003e9a" opacity=".24">
    <rect x="25" y="29" width="70" height="62" rx="13"/>
    <rect x="102" y="29" width="70" height="62" rx="13"/>
    <rect x="24" y="100" width="70" height="62" rx="13"/>
    <rect x="102" y="100" width="70" height="62" rx="13"/>
  </g>
  <g fill="url(#glass)" stroke="url(#glassEdge)" stroke-width="2.8">
    <rect x="23" y="27" width="70" height="61" rx="13"/>
    <rect x="100" y="27" width="70" height="61" rx="13"/>
    <rect x="22" y="97" width="70" height="62" rx="13"/>
    <rect x="100" y="97" width="70" height="62" rx="13"/>
  </g>
  <g fill="#bbf2ff" opacity=".1">
    <path d="M26 75 74 30h8L26 84Z"/>
    <path d="m103 75 48-45h8l-56 54Z"/>
    <path d="m25 145 48-45h8l-56 54Z"/>
  </g>
  <g fill="none" stroke="#a8e7ff" stroke-width="6" stroke-linecap="round" opacity=".84">
    <path d="M36 43h36M36 55h27M113 43h37M113 55h27M35 113h37M35 125h27"/>
  </g>
  <!-- Layered shadows work without SVG filter support in Qt 5. -->
  <rect x="61" y="73" width="109" height="101" rx="16" fill="#00265f" opacity=".12"/>
  <rect x="63" y="73" width="106" height="100" rx="15" fill="#00255f" opacity=".23"/>
  <rect x="62" y="69" width="106" height="100" rx="15" fill="url(#paper)"/>
  <g clip-path="url(#noteClip)">
    <path d="M62 69h106v24H62Z" fill="url(#header)"/>
    <path d="M63 93h104" stroke="#fff7ba" stroke-opacity=".8"/>
    <path d="m147 169 21-20v20Z" fill="#ffcf40" opacity=".5"/>
  </g>
  <rect x="62" y="69" width="106" height="100" rx="15" fill="none" stroke="#fff6ba" stroke-width="1.6"/>
  <g fill="#fffcdd" stroke="#fff" stroke-width=".7">
    <circle cx="80.5" cy="81" r="4.4"/><circle cx="95.8" cy="81" r="4.4"/>
  </g>
  <g fill="none" stroke="url(#ink)" stroke-width="6.5" stroke-linecap="round">
    <path d="M78 108h67M78 124h55M78 140h37"/>
  </g>
  <!-- Pencil points down-left, matching the supplied artwork. -->
  <g transform="rotate(38 149 144)">
    <path d="M140 117h17v42l-8.5 17-8.5-17Z" fill="#744c15" opacity=".18" transform="translate(2 2)"/>
    <path d="M140 128h17v31l-8.5 17-8.5-17Z" fill="#ffdf8a"/>
    <path d="M140 128h17v29h-17Z" fill="url(#barrel)"/>
    <path d="M141 129h3v27h-3Z" fill="#77eaff" opacity=".85"/>
    <path d="M154 129h3v28h-3Z" fill="#005bb9" opacity=".7"/>
    <path d="M140 124v-7q0-5 5-5h7q5 0 5 5v7Z" fill="url(#eraser)"/>
    <path d="M140 122h17v7h-17Z" fill="#d5edee"/>
    <path d="M140 127h17v2h-17Z" fill="#82b8ce"/>
    <path d="m140 157 8.5 19V158Z" fill="#fff5c4"/>
    <path d="m148.5 158 8.5-1-8.5 19Z" fill="#e2b65b"/>
    <path d="m145 168 3.5 8 3.5-8Z" fill="#39424b"/>
  </g>
</svg>
